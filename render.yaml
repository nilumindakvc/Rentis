# Exported from Render on 2026-11-01T14:43:49Z
version: "1"
projects:
- name: rentis
  environments:
  - name: Production
    services:
    - type: web
      name: rentis-backend
      runtime: docker
      repo: https://github.com/nilumindakvc/Rentis
      branch: stripe-billing
      plan: free
      envVars:
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PLATFORM_COUNTRY
        sync: false
      - key: STRIPE_BILLING_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: APP_ENV
        sync: false
      region: oregon
      dockerContext: .
      dockerfilePath: ./backend/Dockerfile
      autoDeployTrigger: commit
    - type: web
      name: rentis-admin
      runtime: static
      repo: https://github.com/nilumindakvc/Rentis
      branch: stripe-billing
      envVars:
      - key: VITE_API_BASE_URL
        sync: false
      buildCommand: cd frontend && npm ci && npm run build && cp dist/admin.html dist/index.html
      staticPublishPath: ./frontend/dist
      routes:
      - type: rewrite
        source: /*
        destination: /admin.html
      autoDeployTrigger: commit
    - type: web
      name: rentis-user
      runtime: static
      repo: https://github.com/nilumindakvc/Rentis
      branch: stripe-billing
      envVars:
      - key: VITE_API_BASE_URL
        sync: false
      buildCommand: cd frontend && npm ci && npm run build
      staticPublishPath: ./frontend/dist
      routes:
      - type: rewrite
        source: /*
        destination: /index.html
      autoDeployTrigger: commit
